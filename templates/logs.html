<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logs — Portal Web</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="page page--logs">
        <header class="logs-header">
            <div>
                <h1 class="logs-header__title">Registro de acessos</h1>
                <p class="logs-header__subtitle">Conteúdo de <code>log.txt</code></p>
            </div>
            <a class="btn btn--secondary" href="/">Voltar ao início</a>
        </header>

        <section class="logs-panel">
            {% if content %}
            <pre class="logs-raw">{{ content }}</pre>
            {% else %}
            <p class="logs-empty">Nenhum registro encontrado em <code>log.txt</code>.</p>
            {% endif %}
        </section>
    </main>
</body>
</html>
